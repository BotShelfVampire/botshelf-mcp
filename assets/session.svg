<text class="l l13" x="24" y="342" xml:space="preserve"><tspan>- </tspan><tspan class="b">What</tspan><tspan> </tspan><tspan class="b">it</tspan><tspan> </tspan><tspan class="b">does:</tspan><tspan> A fill-in Claude Code prompt that asks it to review a change for correctness,</tspan></text>
