<title id="t">A recorded Claude Code session with the BotShelf Vampire MCP server: 3 tool calls and the answer</title>
<desc id="d">Prompt: Find a code review recipe for Claude Code on the BotShelf Vampire shelf. Use the botshelf tools: list_filters to learn the exact where-it-runs name, then search_items with that filter (limit 3), then get_item for the best match (max_chars 600). Answer in three short lines: the item's title and id, what it does, and where it stops. Calls: list_filters -&gt; 1,295 items · 7 kinds · 70 where-it-runs names · 82 topics; search_items -&gt; 6 matches · Code Review · Diff review · Research-Reviewer Team; get_item -&gt; the first 600 of 1,874 characters of “Code Review”. Recorded with Claude Code 2.1.308 on 2026-11-19 · server 1.1.0 · drawn from the client's event stream, not a screen capture.</desc>
